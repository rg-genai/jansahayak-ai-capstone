services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jansahayak-backend
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      - ./eval/reports:/app/eval/reports
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: jansahayak-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
